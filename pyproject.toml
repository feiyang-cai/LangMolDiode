[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langmoldiode"
version = "0.1.0"
description = "SFT and DAPO training for text-to-molecule generation"
requires-python = ">=3.10"
dependencies = ["pyarrow", "rdkit"]

[project.optional-dependencies]
test = ["pytest"]
sft = ["datasets", "transformers", "torch", "unsloth"]
publish = ["huggingface_hub"]

[tool.setuptools]
packages = ["rl"]
